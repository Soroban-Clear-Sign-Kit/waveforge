name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test
        run: cargo test --all
      - name: Lint with clippy
        run: cargo clippy -- -D warnings
      - name: Build contract
        run: stellar contract build
