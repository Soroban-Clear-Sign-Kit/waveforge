name: Bug Report
description: File a bug report to help improve waveforge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps or commands to reproduce the observed behavior.
      placeholder: |
        1. Run 'waveforge repo ...'
        2. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Version of waveforge installed (e.g. v0.1.0).
      placeholder: "v0.1.0"
    validations:
      required: true
